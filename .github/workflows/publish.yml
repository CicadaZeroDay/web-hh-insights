name: Publish Insights

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['generate.mjs', '.github/workflows/publish.yml']

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate site from web-hh.com feed
        run: node generate.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore: regenerate insights"
            git push
          fi
